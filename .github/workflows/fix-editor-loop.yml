name: Fix 3.4.0 editor render loop

on:
  push:
    branches:
      - release/3.4.0-quality-reliability
    paths:
      - .github/workflows/fix-editor-loop.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/3.4.0-quality-reliability
          fetch-depth: 0

      - name: Apply editor hotfix
        run: python3 scripts/fix_editor_render_loop.py

      - name: Syntax check
        run: node --check src/migraine-risk-card.js

      - name: Regression tests
        run: node tests/test-core.js

      - name: Verify dist sync
        run: diff -u src/migraine-risk-card.js dist/migraine-risk-card.js

      - name: Restore temporary preparation files
        run: |
          git checkout HEAD -- scripts/fix_editor_render_loop.py
          git checkout HEAD -- .github/workflows/fix-editor-loop.yml

      - name: Check whitespace
        run: git diff --check

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix visual editor translation render loop"
          git push origin HEAD:release/3.4.0-quality-reliability

# Triggered after staging the patch script.
