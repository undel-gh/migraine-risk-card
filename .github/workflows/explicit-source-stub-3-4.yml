name: Apply explicit-source stub fix

# One-shot release-branch helper; removed after the validated patch lands.
on:
  push:
    branches:
      - release/3.4.0-quality-reliability
    paths:
      - .github/workflows/explicit-source-stub-3-4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/3.4.0-quality-reliability
          fetch-depth: 0

      - name: Apply explicit-source stub fix
        run: python3 scripts/disable_stub_autodetect_3_4.py

      - name: Syntax check
        run: node --check src/migraine-risk-card.js

      - name: Regression tests
        run: node tests/test-core.js

      - name: Verify dist sync
        run: diff -u src/migraine-risk-card.js dist/migraine-risk-card.js

      - name: Check whitespace
        run: git diff --check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/migraine-risk-card.js dist/migraine-risk-card.js tests/test-core.js README.md RELEASE_NOTES_3.4.0.md
          git commit -m "Make new cards require explicit source selection"
          git push origin HEAD:release/3.4.0-quality-reliability
