name: Prepare 3.4.0 release branch

on:
  push:
    branches:
      - release/3.4.0-quality-reliability
    paths:
      - .github/workflows/prepare-3.4.0.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/3.4.0-quality-reliability
          fetch-depth: 0

      - name: Apply 3.4.0 quality/reliability changes
        run: python3 scripts/prepare_3_4_0.py

      - name: Syntax check
        run: node --check src/migraine-risk-card.js

      - name: Unit and regression tests
        run: node tests/test-core.js

      - name: Verify release artifact sync
        run: diff -u src/migraine-risk-card.js dist/migraine-risk-card.js

      - name: Check whitespace
        run: git diff --check

      - name: Commit prepared release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 3.4.0 quality/reliability release"
          git push origin HEAD:release/3.4.0-quality-reliability
